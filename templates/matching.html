{% extends "base.html" %}{% block title %}Smart Matching{% endblock %}
{% block content %}<h2>Smart Matching</h2><p class="text-muted">Matches are calculated from live donation and NGO requirement records.</p>
<button class="btn btn-primary mb-3" onclick="run()">Calculate Matches</button><div class="card p-3"><table class="table" id="t"></table></div>{% endblock %}
{% block scripts %}<script>async function run(){await api('/api/matches','POST',{});load()}async function load(){let r=await api('/api/matches');t.innerHTML='<tr><th>Food</th><th>NGO</th><th>Score</th><th>Donation status</th></tr>'+r.matches.map(x=>`<tr><td>${x.food_name}</td><td>${x.organization_name}</td><td>${x.match_score}</td><td>${x.donation_status}</td></tr>`).join('')}load()</script>{% endblock %}
