{% extends "base.html" %}{% block title %}Notifications{% endblock %}
{% block content %}<h2>Notifications</h2><div id="list"></div>{% endblock %}
{% block scripts %}<script>async function load(){let r=await api('/api/notifications');list.innerHTML=r.notifications.length?r.notifications.map(x=>`<div class="card p-3 mb-2"><b>${x.title}</b><p class="mb-0">${x.message}</p><small>${x.created_at}</small></div>`).join(''):'<p>No notifications.</p>'}load()</script>{% endblock %}
