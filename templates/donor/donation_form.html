{% extends "base.html" %}{% block title %}Create Donation{% endblock %}
{% block content %}<div class="card p-4"><h2>Create Food Donation</h2><form id="donationForm" class="row g-3">
<div class="col-md-6"><label>Food category</label><select class="form-select" id="category_id" name="category_id" required></select></div>
<div class="col-md-6"><label>Food name</label><input class="form-control" name="food_name" required></div>
<div class="col-md-4"><label>Quantity</label><input class="form-control" name="quantity" type="number" step="0.01" min="0.01" required></div>
<div class="col-md-4"><label>Unit</label><input class="form-control" name="unit" placeholder="kg / meals / packets" required></div>
<div class="col-md-4"><label>Preparation date/time</label><input class="form-control" name="prepared_at" type="datetime-local" required></div>
<div class="col-md-6"><label>Expiry/use-by</label><input class="form-control" name="expiry_at" type="datetime-local" required></div>
<div class="col-md-6"><label>Pickup availability</label><input class="form-control" name="pickup_availability" placeholder="e.g. 5 PM - 8 PM" required></div>
<div class="col-12"><label>Pickup address</label><textarea class="form-control" name="pickup_address" required></textarea></div>
<div class="col-12"><label>Description</label><textarea class="form-control" name="description"></textarea></div>
<div class="col-12"><label>Additional notes</label><textarea class="form-control" name="notes"></textarea></div>
<div class="col-12"><button class="btn btn-primary">Submit Donation</button></div></form></div>{% endblock %}
{% block scripts %}<script>
(async()=>{let c=await api('/api/categories');category_id.innerHTML='<option value="">Select</option>'+c.categories.map(x=>`<option value="${x.category_id}">${x.name}</option>`).join('')})();
document.getElementById('donationForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await api('/api/donations','POST',d);if(r.donation_id) location.href='/donor';};
</script>{% endblock %}
