{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="auth-card card p-4 mx-auto"><h2>Login</h2><form id="loginForm">
<input class="form-control mb-3" name="email" type="email" placeholder="Email" required>
<input class="form-control mb-3" name="password" type="password" placeholder="Password" required>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New user? <a href="/register">Create account</a></p></div>{% endblock %}
{% block scripts %}<script>
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/auth/login','POST',Object.fromEntries(new FormData(e.target)));if(r.redirect) location.href=r.redirect;};
</script>{% endblock %}
