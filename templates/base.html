<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}FoodShare{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
</head><body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark"><div class="container">
<a class="navbar-brand fw-bold" href="/">FoodShare</a>
<div class="d-flex gap-2 align-items-center">
{% if current_user %}
<a class="btn btn-sm btn-outline-light" href="/dashboard">Dashboard</a>
<a class="btn btn-sm btn-outline-light" href="/rankings">Leaderboard</a><a class="btn btn-sm btn-outline-light" href="/profile">Profile</a><a class="btn btn-sm btn-outline-light" href="/notifications">Alerts</a>
<span class="text-white small">{{ current_user.name }} ({{ current_user.role }})</span>
<a class="btn btn-sm btn-warning" href="/logout">Logout</a>
{% else %}<a class="btn btn-sm btn-outline-light" href="/login">Login</a><a class="btn btn-sm btn-warning" href="/register">Register</a>{% endif %}
</div></div></nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<div id="toast" class="toast-msg"></div>
<script src="{{ url_for('static',filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
