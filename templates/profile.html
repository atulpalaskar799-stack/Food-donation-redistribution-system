{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}<div class="card p-4"><h2>My Profile</h2><form id="f" class="row g-3"><div class="col-md-6"><label>Name</label><input id="name" name="name" class="form-control" required></div><div class="col-md-6"><label>Phone</label><input id="phone" name="phone" class="form-control"></div><div class="col-12"><label>Organization / Area</label><input id="organization_name" name="organization_name" class="form-control"></div><div class="col-12"><label>Address / Area</label><input id="address" name="address" class="form-control"></div><button class="btn btn-primary">Save</button></form></div>{% endblock %}
{% block scripts %}<script>async function load(){let r=await api('/api/profile');name.value=r.user.name;phone.value=r.user.phone||'';organization_name.value=r.profile.organization_name||r.profile.area||'';address.value=r.profile.address||r.profile.area||''}f.onsubmit=async e=>{e.preventDefault();await api('/api/profile','PUT',Object.fromEntries(new FormData(e.target)));toast('Profile saved')};load()</script>{% endblock %}
