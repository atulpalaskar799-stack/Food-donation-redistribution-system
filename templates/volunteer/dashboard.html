{% extends "base.html" %}{% block title %}Volunteer Dashboard{% endblock %}
{% block content %}<div class="d-flex justify-content-between"><h2>Volunteer Dashboard</h2><div><button class="btn btn-success" onclick="setAvail('available')">Available</button><button class="btn btn-secondary" onclick="setAvail('unavailable')">Unavailable</button></div></div>
<div class="card p-3 mt-3"><h5>My Assignments</h5><table class="table" id="assignments"></table></div>{% endblock %}
{% block scripts %}<script>
async function load(){let a=await api('/api/assignments');assignments.innerHTML='<tr><th>Food</th><th>Pickup</th><th>Delivery</th><th>Actions</th></tr>'+a.assignments.map(x=>`<tr><td>${x.food_name}</td><td>${x.pickup_status}</td><td>${x.delivery_status}</td><td><div class="btn-group btn-group-sm"><button class="btn btn-outline-primary" onclick="st(${x.assignment_id},'pickup_started')">Start</button><button class="btn btn-outline-primary" onclick="st(${x.assignment_id},'picked_up')">Picked</button><button class="btn btn-outline-primary" onclick="st(${x.assignment_id},'out_for_delivery')">Out</button><button class="btn btn-success" onclick="st(${x.assignment_id},'delivered')">Delivered</button></div></td></tr>`).join('')}async function st(id,a){await api('/api/assignments/'+id+'/status','POST',{action:a});load()}async function setAvail(v){await api('/api/volunteer/availability','POST',{availability:v});toast('Availability updated')}load();
</script>{% endblock %}
